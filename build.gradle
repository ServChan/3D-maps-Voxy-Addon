plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group
def modVersion = project.version.toString()
def licenseArchiveName = project.name
def localVoxy = file(project.voxy_jar)
def localModMenu = file(project.modmenu_jar)

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
        content { includeGroup "maven.modrinth" }
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
}

sourceSets {
    playerMarkers {
        java {
            srcDir "src/playerMarkers/java"
        }
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
    syncServer {
        java {
            srcDir "src/syncServer/java"
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

loom {
    mods {
        "voxymap" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
            sourceSet sourceSets.playerMarkers
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${project.fabric_key_mapping_api_version}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_lifecycle_events_version}"
    implementation "net.fabricmc.fabric-api:fabric-rendering-v1:${project.fabric_rendering_v1_version}"

    if (localVoxy.isFile()) {
        compileOnly files(localVoxy)
    } else {
        compileOnly("maven.modrinth:voxy:${project.voxy_version}") { transitive = false }
    }
    compileOnly("maven.modrinth:iris:${project.iris_version}") { transitive = false }
    compileOnly("maven.modrinth:sodium:${project.sodium_version}") { transitive = false }
    if (localModMenu.isFile()) {
        compileOnly files(localModMenu)
    } else {
        compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    }
    testImplementation sourceSets.client.output
    testImplementation sourceSets.playerMarkers.output
    testImplementation sourceSets.syncServer.output
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.11.0"
}

tasks.register("syncServerJar", Jar) {
    group = "build"
    description = "Builds the standalone voxymap-sync-server.jar (waypoint sync server, no Minecraft required)."
    archiveBaseName = "voxymap-sync-server"
    archiveVersion = modVersion
    from(sourceSets.syncServer.output)
    from(sourceSets.main.output)
    manifest {
        attributes "Main-Class": "com.voxymap.syncserver.WaypointSyncServer"
    }
}

tasks.register("runSyncServer", JavaExec) {
    group = "application"
    description = "Runs the waypoint sync server locally. Pass args with --args=\"--port 8642 --password secret\"."
    mainClass = "com.voxymap.syncserver.WaypointSyncServer"
    classpath = sourceSets.syncServer.runtimeClasspath
}

tasks.withType(ProcessResources).configureEach {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xlint:deprecation"]
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def playerMarkerClasses = "com/voxymap/client/playermarkers/**"

jar {
    from("LICENSE") {
        rename { "${it}_${licenseArchiveName}" }
    }
    doLast {
        def leaked = zipTree(archiveFile.get().asFile).matching { include playerMarkerClasses }.files
        if (!leaked.isEmpty()) {
            throw new GradleException("Player-marker classes leaked into the main jar: ${leaked*.name}")
        }
    }
}

def playerMarkersJar = tasks.register("playerMarkersJar", Zip) {
    group = "build"
    description = "Builds the mod jar with the VanillaSquad web-map player markers."
    dependsOn tasks.named("jar"), tasks.named("playerMarkersClasses")
    archiveBaseName = project.archives_base_name
    archiveVersion = modVersion
    archiveClassifier = "player-markers"
    archiveExtension = "jar"
    destinationDirectory = tasks.named("jar", Jar).flatMap { it.destinationDirectory }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(zipTree(tasks.named("jar", Jar).flatMap { it.archiveFile }))
    from(sourceSets.playerMarkers.output)
    doLast {
        def included = zipTree(archiveFile.get().asFile).matching { include playerMarkerClasses }.files
        if (included.isEmpty()) {
            throw new GradleException("Player-marker classes are missing from the player-markers jar")
        }
    }
}

tasks.named("assemble") {
    dependsOn playerMarkersJar
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

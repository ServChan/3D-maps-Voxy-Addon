plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group
def modVersion = project.version.toString()
def licenseArchiveName = project.name

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
        content { includeGroup "maven.modrinth" }
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "voxymap" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Standalone waypoint sync server: a plain dependency-free Java program (no Minecraft/Fabric API),
// shipped as its own jar so it can run on a machine that has no Minecraft install at all. It only
// shares the wire-format code in src/main/java/com/voxymap/shared - never anything client-side.
sourceSets {
    syncServer {
        java {
            srcDir "src/syncServer/java"
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${project.fabric_key_mapping_api_version}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_lifecycle_events_version}"

    compileOnly("maven.modrinth:voxy:${project.voxy_version}") { transitive = false }
    compileOnly("maven.modrinth:iris:${project.iris_version}") { transitive = false }
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    testImplementation sourceSets.client.output
    testImplementation sourceSets.syncServer.output
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.11.0"
}

tasks.register("syncServerJar", Jar) {
    group = "build"
    description = "Builds the standalone voxymap-sync-server.jar (waypoint sync server, no Minecraft required)."
    archiveBaseName = "voxymap-sync-server"
    archiveVersion = modVersion
    from(sourceSets.syncServer.output)
    from(sourceSets.main.output)
    manifest {
        attributes "Main-Class": "com.voxymap.syncserver.WaypointSyncServer"
    }
}

tasks.register("runSyncServer", JavaExec) {
    group = "application"
    description = "Runs the waypoint sync server locally. Pass args with --args=\"--port 8642 --password secret\"."
    mainClass = "com.voxymap.syncserver.WaypointSyncServer"
    classpath = sourceSets.syncServer.runtimeClasspath
}

tasks.withType(ProcessResources).configureEach {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xlint:deprecation"]
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

jar {
    from("LICENSE") {
        rename { "${it}_${licenseArchiveName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

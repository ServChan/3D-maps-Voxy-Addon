plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group
def modVersion = project.version.toString()
def licenseArchiveName = project.name
def localVoxy = file(project.voxy_jar)
def localModMenu = file(project.modmenu_jar)

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
        content { includeGroup "maven.modrinth" }
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
}

sourceSets {
    playerMarkers {
        java {
            srcDir "src/playerMarkers/java"
        }
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
    syncServer {
        java {
            srcDir "src/syncServer/java"
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "voxymap_gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = false
    }
}

loom {
    mods {
        "voxymap" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
            sourceSet sourceSets.playerMarkers
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${project.fabric_key_mapping_api_version}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_lifecycle_events_version}"
    implementation "net.fabricmc.fabric-api:fabric-rendering-v1:${project.fabric_rendering_v1_version}"
    implementation "net.fabricmc.fabric-api:fabric-message-api-v1:${project.fabric_message_api_version}"
    implementation "net.fabricmc.fabric-api:fabric-command-api-v2:${project.fabric_command_api_version}"

    if (localVoxy.isFile()) {
        compileOnly files(localVoxy)
    } else {
        compileOnly("maven.modrinth:voxy:${project.voxy_version}") { transitive = false }
    }
    compileOnly("maven.modrinth:iris:${project.iris_version}") { transitive = false }
    compileOnly("maven.modrinth:sodium:${project.sodium_version}") { transitive = false }
    if (localModMenu.isFile()) {
        compileOnly files(localModMenu)
    } else {
        compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    }
    if (providers.gradleProperty("devClient").isPresent()) {
        localRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        localRuntime(localVoxy.isFile() ? files(localVoxy) : "maven.modrinth:voxy:${project.voxy_version}")
        localRuntime("maven.modrinth:sodium:${project.sodium_version}") { transitive = false }
        def clientBridge = file("../ClientBridge/build/libs/client-bridge-1.0.0.jar")
        if (clientBridge.isFile()) {
            localRuntime files(clientBridge)
        }
    }
    gametestImplementation sourceSets.client.output
    gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    if (localVoxy.isFile()) {
        gametestRuntimeOnly files(localVoxy)
    } else {
        gametestRuntimeOnly("maven.modrinth:voxy:${project.voxy_version}") { transitive = false }
    }
    gametestRuntimeOnly("maven.modrinth:sodium:${project.sodium_version}") { transitive = false }
    testImplementation sourceSets.client.output
    testImplementation sourceSets.playerMarkers.output
    testImplementation sourceSets.syncServer.output
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.11.0"
}

tasks.register("syncServerJar", Jar) {
    group = "build"
    description = "Builds the standalone voxymap-sync-server.jar (waypoint sync server, no Minecraft required)."
    archiveBaseName = "voxymap-sync-server"
    archiveVersion = modVersion
    from(sourceSets.syncServer.output)
    from(sourceSets.main.output)
    manifest {
        attributes "Main-Class": "com.voxymap.syncserver.WaypointSyncServer"
    }
}

tasks.register("runSyncServer", JavaExec) {
    group = "application"
    description = "Runs the waypoint sync server locally. Pass args with --args=\"--port 8642 --password secret\"."
    mainClass = "com.voxymap.syncserver.WaypointSyncServer"
    classpath = sourceSets.syncServer.runtimeClasspath
}

tasks.withType(ProcessResources).configureEach {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xlint:deprecation"]
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def playerMarkerClasses = "com/voxymap/client/playermarkers/**"

jar {
    from("LICENSE") {
        rename { "${it}_${licenseArchiveName}" }
    }
    doLast {
        def leaked = zipTree(archiveFile.get().asFile).matching { include playerMarkerClasses }.files
        if (!leaked.isEmpty()) {
            throw new GradleException("Player-marker classes leaked into the main jar: ${leaked*.name}")
        }
    }
}

def playerMarkersJar = tasks.register("playerMarkersJar", Zip) {
    group = "build"
    description = "Builds the mod jar with the VanillaSquad web-map player markers."
    dependsOn tasks.named("jar"), tasks.named("playerMarkersClasses")
    archiveBaseName = project.archives_base_name
    archiveVersion = modVersion
    archiveClassifier = "player-markers"
    archiveExtension = "jar"
    destinationDirectory = tasks.named("jar", Jar).flatMap { it.destinationDirectory }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(zipTree(tasks.named("jar", Jar).flatMap { it.archiveFile }))
    from(sourceSets.playerMarkers.output)
    doLast {
        def included = zipTree(archiveFile.get().asFile).matching { include playerMarkerClasses }.files
        if (included.isEmpty()) {
            throw new GradleException("Player-marker classes are missing from the player-markers jar")
        }
    }
}

tasks.named("assemble") {
    dependsOn playerMarkersJar
}

def bundledSodiumRange = project.findProperty("bundled_sodium_range") ?: ">=0.9.2- <0.10"

def bundledVoxyModJson = tasks.register("bundledVoxyModJson") {
    group = "build"
    description = "Writes Voxy's fabric.mod.json with a wider Sodium range for the personal bundled jar."
    def target = layout.buildDirectory.file("bundled-voxy-metadata/fabric.mod.json")
    def sodiumRange = bundledSodiumRange
    inputs.file(localVoxy)
    inputs.property("sodiumRange", sodiumRange)
    outputs.file(target)
    onlyIf { localVoxy.isFile() }
    doLast {
        def text = zipTree(localVoxy).matching { include "fabric.mod.json" }.singleFile.getText("UTF-8")
        def metadata = new groovy.json.JsonSlurper().parseText(text)
        if (metadata.depends?.sodium != null) {
            metadata.depends.sodium = sodiumRange
        }
        def file = target.get().asFile
        file.parentFile.mkdirs()
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
    }
}

def bundledVoxyJar = tasks.register("bundledVoxyJar", Zip) {
    group = "build"
    description = "Repacks the local Voxy jar with the wider Sodium range for the personal bundled jar."
    dependsOn bundledVoxyModJson
    onlyIf { localVoxy.isFile() }
    archiveFileName = localVoxy.name
    destinationDirectory = layout.buildDirectory.dir("bundled-voxy")
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(zipTree(localVoxy)) {
        exclude "fabric.mod.json"
    }
    from(layout.buildDirectory.dir("bundled-voxy-metadata"))
}

def bundledModJson = tasks.register("bundledModJson") {
    group = "build"
    description = "Writes fabric.mod.json for the personal jar with Voxy nested inside."
    dependsOn tasks.named("processResources")
    def source = layout.buildDirectory.file("resources/main/fabric.mod.json")
    def target = layout.buildDirectory.file("bundled-metadata/fabric.mod.json")
    def voxyName = localVoxy.name
    inputs.file(source)
    inputs.property("voxyName", voxyName)
    outputs.file(target)
    doLast {
        def metadata = new groovy.json.JsonSlurper().parse(source.get().asFile)
        metadata.jars = [[file: "META-INF/jars/" + voxyName]]
        metadata.description = metadata.description + " Personal build with Voxy nested inside: Voxy is All Rights Reserved, do not share this jar."
        def file = target.get().asFile
        file.parentFile.mkdirs()
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
    }
}

tasks.register("bundledJar", Zip) {
    group = "build"
    description = "Builds a personal voxy-map jar with the local Voxy jar nested inside. Never publish it: Voxy is All Rights Reserved."
    dependsOn tasks.named("jar"), bundledModJson, bundledVoxyJar
    onlyIf { localVoxy.isFile() }
    archiveBaseName = project.archives_base_name
    archiveVersion = modVersion
    archiveClassifier = "bundled"
    archiveExtension = "jar"
    destinationDirectory = tasks.named("jar", Jar).flatMap { it.destinationDirectory }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(zipTree(tasks.named("jar", Jar).flatMap { it.archiveFile })) {
        exclude "fabric.mod.json"
    }
    from(layout.buildDirectory.dir("bundled-metadata"))
    from(bundledVoxyJar.flatMap { it.archiveFile }) {
        into "META-INF/jars"
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
